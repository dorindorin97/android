name: Android CI/CD

on:
  push:
    branches: [develop, main, master]
    tags: ['v*']
  pull_request:
    branches: [develop, main, master]
  schedule:
    - cron: '0 2 * * *'   # nightly at 2 AM UTC
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a GitHub Release with this tag (e.g. v1.8.1). Leave blank to just build.'
        required: false
        default: ''

# ─────────────────────────────────────────────────────────────────────────────
# Shared setup steps are duplicated across jobs because GitHub Actions does not
# support true YAML anchors between jobs. Extract to a composite action if this
# grows further (.github/actions/build-setup/).
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ── 1. Unit tests ───────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Run unit tests
        run: ./gradlew test --stacktrace
        continue-on-error: true
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: cSploit/build/reports/tests/
          retention-days: 7

  # ── 2. Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Run lint
        run: ./gradlew lint --stacktrace
        continue-on-error: true
      - name: Upload lint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: cSploit/build/reports/lint-results*.html
          retention-days: 7

  # ── 3. Debug APK — every branch push (not tags, not PRs) ───────────────────
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e
          add-to-path: true

      - name: Build JNI libraries
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd cSploit
          chmod +x build-jni-libs.sh
          ./build-jni-libs.sh
          ls -la src/main/jniLibs/*/lib*.so || (echo "ERROR: JNI libraries not built!" && exit 1)

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Get version info
        id: version
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Build debug APK
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          find cSploit/build/outputs/apk/debug -name "*.apk" | head -1 | \
            xargs -I{} cp {} "dist/cSploit-debug-${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha_short }}.apk"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cSploit-debug-${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha_short }}
          path: dist/*.apk
          retention-days: 14

  # ── 4. Release — both APKs published to GitHub Releases ────────────────────
  #     Triggers on v* tags  OR  workflow_dispatch with a release_tag input.
  release:
    name: Build & Publish Debug + Release APKs
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    permissions:
      contents: write   # required to create GitHub Releases

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e
          add-to-path: true

      - name: Build JNI libraries
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd cSploit
          chmod +x build-jni-libs.sh
          ./build-jni-libs.sh
          ls -la src/main/jniLibs/*/lib*.so || (echo "ERROR: JNI libraries not built!" && exit 1)

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Get version info
        id: version
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          APP_VERSION=$(grep 'versionName' cSploit/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT

      # ── Signing: use repo secrets when set, else generate a self-signed key ─
      - name: Prepare signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "source=repo-secret" >> $GITHUB_OUTPUT
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            echo "keystore_file=$KEYSTORE_PATH"                         >> $GITHUB_OUTPUT
            echo "keystore_pwd=${{ secrets.KEYSTORE_PASSWORD }}"        >> $GITHUB_OUTPUT
            echo "key_alias=${{ secrets.KEYSTORE_ALIAS }}"              >> $GITHUB_OUTPUT
            echo "key_pwd=${{ secrets.KEYSTORE_ALIAS_PASSWORD }}"       >> $GITHUB_OUTPUT
          else
            echo "source=self-signed" >> $GITHUB_OUTPUT
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -alias csploit \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=cSploit Build, OU=cSploit, O=cSploit, L=Internet, ST=Internet, C=US" \
              -storepass csploit_build -keypass csploit_build \
              -storetype JKS 2>/dev/null
            echo "keystore_file=$KEYSTORE_PATH" >> $GITHUB_OUTPUT
            echo "keystore_pwd=csploit_build"   >> $GITHUB_OUTPUT
            echo "key_alias=csploit"            >> $GITHUB_OUTPUT
            echo "key_pwd=csploit_build"        >> $GITHUB_OUTPUT
          fi

      # ── Build both variants ──────────────────────────────────────────────────
      - name: Build debug APK
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_FILE:      ${{ steps.signing.outputs.keystore_file }}
          KEYSTORE_PWD:       ${{ steps.signing.outputs.keystore_pwd }}
          KEYSTORE_ALIAS:     ${{ steps.signing.outputs.key_alias }}
          KEYSTORE_ALIAS_PWD: ${{ steps.signing.outputs.key_pwd }}

      # ── Collect and rename ───────────────────────────────────────────────────
      - name: Collect APKs
        id: apks
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          mkdir -p dist

          DEBUG_APK="cSploit-${TAG}-debug.apk"
          RELEASE_APK="cSploit-${TAG}-release.apk"

          find cSploit/build/outputs/apk/debug   -name "*.apk" | head -1 | xargs -I{} cp {} "dist/$DEBUG_APK"
          find cSploit/build/outputs/apk/release -name "*.apk" | head -1 | xargs -I{} cp {} "dist/$RELEASE_APK"

          echo "debug_apk=$DEBUG_APK"     >> $GITHUB_OUTPUT
          echo "release_apk=$RELEASE_APK" >> $GITHUB_OUTPUT
          echo "=== Built APKs ==="
          ls -lh dist/

      # ── Artifacts (always kept) ──────────────────────────────────────────────
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apks.outputs.debug_apk }}
          path: dist/${{ steps.apks.outputs.debug_apk }}
          retention-days: 90

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apks.outputs.release_apk }}
          path: dist/${{ steps.apks.outputs.release_apk }}
          retention-days: 90

      # ── GitHub Release with both APKs ────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "cSploit ${{ steps.tag.outputs.name }}"
          body: |
            ## cSploit ${{ steps.tag.outputs.name }}

            | File | Type |
            |------|------|
            | `${{ steps.apks.outputs.release_apk }}` | **Stable release** — minified, optimised, no debug flags, signed (${{ steps.signing.outputs.source }}) |
            | `${{ steps.apks.outputs.debug_apk }}`   | **Debug build** — full logging, debuggable, not minified |

            **Commit:** `${{ steps.version.outputs.sha_short }}` &nbsp;·&nbsp; **Built:** ${{ steps.version.outputs.date }}

            > ℹ️ If the release APK was signed with a *self-signed* key (no `KEYSTORE_BASE64` secret configured),
            > you must enable **"Install from unknown sources"** on your device, or install via ADB:
            > ```
            > adb install cSploit-${{ steps.tag.outputs.name }}-release.apk
            > ```
          files: |
            dist/${{ steps.apks.outputs.debug_apk }}
            dist/${{ steps.apks.outputs.release_apk }}
          draft: false
          generate_release_notes: true
          prerelease: ${{ contains(steps.tag.outputs.name, '-beta') || contains(steps.tag.outputs.name, '-rc') || contains(steps.tag.outputs.name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 5. PR build ─────────────────────────────────────────────────────────────
  pr-build:
    name: PR Build Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e
          add-to-path: true

      - name: Build JNI libraries
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd cSploit
          chmod +x build-jni-libs.sh
          ./build-jni-libs.sh
          ls -la src/main/jniLibs/*/lib*.so || (echo "ERROR: JNI libraries not built!" && exit 1)

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Get PR info
        id: pr
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build debug APK
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          find cSploit/build/outputs/apk/debug -name "*.apk" | head -1 | \
            xargs -I{} cp {} "dist/cSploit-PR${{ github.event.pull_request.number }}-${{ steps.pr.outputs.sha_short }}.apk"

      - name: Upload PR APK
        uses: actions/upload-artifact@v4
        with:
          name: cSploit-PR${{ github.event.pull_request.number }}
          path: dist/*.apk
          retention-days: 7

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **APK built successfully!** Download from [Actions](' +
                    'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
            })

  # ── 6. Nightly build ─────────────────────────────────────────────────────────
  nightly-build:
    name: Nightly Build
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e
          add-to-path: true

      - name: Build JNI libraries
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd cSploit
          chmod +x build-jni-libs.sh
          ./build-jni-libs.sh
          ls -la src/main/jniLibs/*/lib*.so || (echo "ERROR: JNI libraries not built!" && exit 1)

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Get version info
        id: version
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Build nightly APK
        env:
          NIGHTLY_BUILD: "true"
          NIGHTLY_BUILD_COMMIT: ${{ github.sha }}
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          find cSploit/build/outputs/apk/debug -name "*.apk" | head -1 | \
            xargs -I{} cp {} "dist/cSploit-nightly-${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha_short }}.apk"

      - name: Upload nightly APK
        uses: actions/upload-artifact@v4
        with:
          name: cSploit-nightly-${{ steps.version.outputs.date }}
          path: dist/*.apk
          retention-days: 7
