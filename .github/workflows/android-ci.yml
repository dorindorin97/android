name: Android CI/CD

on:
  push:
    branches: [ develop, main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ develop, main, master ]
  schedule:
    # Nightly build at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Run lint
      run: ./gradlew lint
      
    - name: Upload lint results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lint-results
        path: cSploit/build/reports/lint-results*.html

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Run unit tests
      run: ./gradlew test
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: cSploit/build/test-results/**/*.xml

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run dependency check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'cSploit'
        path: '.'
        format: 'HTML'
        
    - name: Upload dependency check results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-check-report
        path: reports/

  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name != 'schedule' || github.event.inputs.build_type == 'debug'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Get commit SHA
      id: commit
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      
    - name: Build debug APK
      run: ./gradlew assembleDebug
      env:
        BUILD_NAME: ${{ github.actor }}
        
    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: cSploit-debug-${{ steps.commit.outputs.sha_short }}
        path: cSploit/build/outputs/apk/debug/*.apk
        retention-days: 30

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: [lint, test, security-scan]
    if: github.event_name == 'push' && (contains(github.ref, 'refs/tags/') || github.event.inputs.build_type == 'release')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Get commit SHA
      id: commit
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      
    - name: Decode keystore
      if: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $HOME/keystore.jks
        
    - name: Build release APK
      run: ./gradlew assembleRelease
      env:
        KEYSTORE_FILE: ${{ secrets.KEYSTORE_BASE64 && format('{0}/keystore.jks', env.HOME) || '' }}
        KEYSTORE_PWD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        KEYSTORE_ALIAS_PWD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
        BUILD_NAME: "GitHub Actions"
        
    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: cSploit-release-${{ steps.commit.outputs.sha_short }}
        path: cSploit/build/outputs/apk/release/*.apk
        retention-days: 90
        
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: cSploit/build/outputs/apk/release/*.apk
        draft: true
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  nightly-build:
    name: Nightly Build
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    needs: [lint, test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Get commit SHA
      id: commit
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      
    - name: Build nightly APK
      run: ./gradlew assembleDebug
      env:
        NIGHTLY_BUILD: "true"
        NIGHTLY_BUILD_COMMIT: ${{ github.sha }}
        BUILD_NAME: "Nightly"
        
    - name: Upload nightly APK
      uses: actions/upload-artifact@v4
      with:
        name: cSploit-nightly-${{ steps.commit.outputs.sha_short }}
        path: cSploit/build/outputs/apk/debug/*.apk
        retention-days: 7

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: SonarCloud Scan
      if: ${{ secrets.SONAR_TOKEN }}
      run: ./gradlew sonarqube
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [build-debug, build-release, nightly-build]
    if: always() && (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/'))
    
    steps:
    - name: Send notification
      run: |
        echo "Build completed with status: ${{ needs.build-debug.result || needs.build-release.result || needs.nightly-build.result }}"
        # Add your notification logic here (Slack, Discord, Email, etc.)
