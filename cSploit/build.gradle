apply plugin: 'com.android.application'

configurations.all {
    exclude group: 'com.google.guava', module: 'listenablefuture'
    resolutionStrategy {
        force 'com.google.guava:guava:33.5.0-android'
    }
}

dependencies {
    // AndroidX dependencies - latest stable versions
    // Note: removed androidx.legacy:legacy-support-v4 - use AndroidX APIs directly
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    // multidex not needed for minSdk >= 21 (native multidex support)
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-common:2.10.0'
    implementation 'androidx.core:core-ktx:1.18.0'

    // Security library for encrypted preferences and secure credential storage
    // Provides AES-256-GCM encryption for sensitive data
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.work:work-runtime:2.11.1'
    implementation 'com.google.guava:guava:33.5.0-android'

    // Apache Commons - updated versions with security fixes
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'commons-net:commons-net:3.13.0'
    
    // Other dependencies - updated versions
    implementation 'com.github.zafarkhaja:java-semver:0.9.0'
    implementation 'org.unbescape:unbescape:1.1.6.RELEASE'
    // msgpack for Metasploit RPC communication
    // Note: Using 0.6.12 for API compatibility - upgrading to 0.9.x requires refactoring RPCClient
    implementation 'org.msgpack:msgpack:0.6.12'
    implementation 'com.googlecode.juniversalchardet:juniversalchardet:1.0.3'
    implementation 'org.tukaani:xz:1.9'
    
    // ACRA crash reporting - updated
    implementation 'ch.acra:acra-core:5.13.1'
    implementation 'ch.acra:acra-http:5.13.1'
    implementation 'ch.acra:acra-notification:5.13.1'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'

    // JUnit5 (Jupiter) for unit tests
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.14.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.14.3'
    testImplementation 'org.junit.vintage:junit-vintage-engine:5.14.3'

    // Mockito for mocking
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'

    // AssertJ for better assertions
    testImplementation 'org.assertj:assertj-core:3.27.7'

    // Android testing - AndroidX Test
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'

    // Mockito for Android tests
    androidTestImplementation 'org.mockito:mockito-android:5.2.0'

    // Robolectric for unit tests that need Android context
    testImplementation 'org.robolectric:robolectric:4.16.1'
}

android {
    compileSdkVersion 36
    // buildToolsVersion omitted - AGP 9.1.0 uses 36.0.0 by default
    namespace 'org.csploit.android'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Enable buildConfig feature for custom BuildConfig fields
    buildFeatures {
        buildConfig true
    }

    packaging {
        // Modernized packaging configuration (packagingOptions is deprecated)
        resources {
            excludes += ['META-INF/LICENSE.txt', 'META-INF/NOTICE.txt', 'META-INF/LICENSE', 'META-INF/NOTICE']
        }
    }

    defaultConfig {
        minSdkVersion 23  // Updated minimum SDK for better security and features
        targetSdkVersion 36  // Latest target SDK
        versionCode 6
        versionName "1.8.0-stable"
        if(System.getenv("NIGHTLY_BUILD")) {
            versionName += "+" + System.getenv("NIGHTLY_BUILD_COMMIT").substring(0, 7)
        }
    }

    lint {
        // Modernized lint configuration (lintOptions is deprecated)
        // checkReleaseBuilds is disabled unconditionally: several app components
        // (MsfRpcdService, NetworkRadar) use a custom NativeService abstraction
        // rather than android.app.Service — a known architecture choice that
        // triggers the Instantiatable check as a false positive.
        checkReleaseBuilds = false
        abortOnError = false
        // Disable specific warnings that are not relevant
        disable += ['MissingTranslation', 'ExtraTranslation', 'Instantiatable']
        // Enable baseline for tracking known issues
        baseline = file("lint-baseline.xml")
    }

    signingConfigs {
        release {
            def keystoreFile = System.getenv("KEYSTORE_FILE")
            if (keystoreFile != null && keystoreFile != '') {
                storeFile = file(keystoreFile)
                storePassword = System.getenv("KEYSTORE_PWD")
                keyAlias = System.getenv("KEYSTORE_ALIAS")
                keyPassword = System.getenv("KEYSTORE_ALIAS_PWD")
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField "java.util.Date", "BUILD_TIME", "new java.util.Date(" + Calendar.getInstance().getTimeInMillis() + "L)"
            buildConfigField "String", "BUILD_NAME", "\"" + System.getenv("USER") + "\""
            minifyEnabled false
            shrinkResources false
            debuggable true
            jniDebuggable true
            zipAlignEnabled true
            multiDexEnabled true
        }
        release {
            buildConfigField "java.util.Date", "BUILD_TIME", "new java.util.Date(" + Calendar.getInstance().getTimeInMillis() + "L)"
            buildConfigField "String", "BUILD_NAME", "\"" + System.getenv("USER") + "\""
            if (System.getenv("KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.release
            }
            // Enable code optimization and obfuscation for release builds
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            multiDexEnabled true
        }
    }
}
