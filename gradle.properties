# AndroidX migration
android.enableJetifier=true
android.useAndroidX=true

# Build performance optimizations
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.configuration-cache=true

# Memory configuration
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError

# Gradle configuration
org.gradle.daemon=true
org.gradle.configureondemand=true

# Suppress warnings
android.suppressUnsupportedCompileSdk=34,35

# Use transitive R class to allow R.id values in switch statements
android.nonTransitiveRClass=false

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# Project info
project.version=1.0.0
project.group=org.csploit
